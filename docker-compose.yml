name: fecoclima-ia-backend

x-app-common: &app-common
  build:
    context: .
  env_file:
    - .env
  restart: unless-stopped
  volumes:
    - fecoclima_data:/data
  networks:
    - fecoclima

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_HOST_PORT:-5437}:5432"
    networks:
      - fecoclima

  migrate:
    <<: *app-common
    restart: "no"
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-common
    command: ["api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *app-common
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  scheduler:
    <<: *app-common
    command: ["scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8.14
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGADMIN_BIND_IP:-127.0.0.1}:${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - fecoclima

volumes:
  postgres_data:
  pgadmin_data:
  fecoclima_data:

networks:
  fecoclima:
    driver: bridge
